<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsightForge AI - 智能数据分析平台</title>
<link rel="stylesheet" href="/static/css/auth.css">
<script src="/static/js/auth.js"></script>
<script src="/static/js/landing.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
       min-height: 100vh; color: #fff; }
/* ── 顶部导航 ── */
.nav-bar { display: flex; align-items: center; justify-content: space-between;
           padding: 18px 40px; }
.nav-brand { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
.nav-actions { display: flex; gap: 12px; align-items: center; }
.nav-btn { padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
           cursor: pointer; transition: all .2s; text-decoration: none; border: none; }
.nav-btn-login { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.4); }
.nav-btn-login:hover { border-color: #fff; }
.nav-btn-start { background: #e94560; color: #fff; }
.nav-btn-start:hover { background: #c23152; }
.nav-btn-workbench { background: #e94560; color: #fff; }
.nav-btn-workbench:hover { background: #c23152; }
/* ── 落地页占位内容（Task 6 填充 Hero/features） ── */
.landing-hero { max-width: 820px; margin: 80px auto; padding: 0 40px; text-align: center; }
.landing-hero h1 { font-size: 44px; margin-bottom: 16px; line-height: 1.2; }
.landing-hero p { font-size: 18px; color: rgba(255,255,255,.78); margin-bottom: 28px; }

/* ── 弹窗（复用旧登录卡配色，Task 9 重塑） ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
                 display: flex; align-items: center; justify-content: center; z-index: 1000; }
.auth-card { background: #fff; border-radius: 16px; padding: 40px; width: 380px;
             box-shadow: 0 20px 60px rgba(0,0,0,.3); color: #1a1a2e; }
.auth-card h2 { font-size: 22px; color: #1a1a2e; margin-bottom: 4px; }
.auth-card .sub { color: #718096; font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5568;
                    margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0;
                    border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s; }
.form-group input:focus { border-color: #e94560; }
.form-group-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a5568; }
.form-group-check input { width: auto; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px;
       font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 8px; }
.btn-primary { background: #e94560; color: #fff; }
.btn-primary:hover { background: #c23152; }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.auth-toggle { display: block; text-align: center; margin-top: 16px; font-size: 13px;
                color: #e94560; cursor: pointer; }
.auth-error { background: #fed7d7; color: #c53030; padding: 10px; border-radius: 8px;
              font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>

<nav class="nav-bar">
  <div class="nav-brand">InsightForge AI</div>
  <div class="nav-actions">
    <button class="nav-btn nav-btn-login" id="btn-login">登录</button>
    <button class="nav-btn nav-btn-start" id="btn-start">免费开始</button>
    <a class="nav-btn nav-btn-workbench hidden" id="btn-workbench" href="/app">进入工作台 →</a>
  </div>
</nav>

<section class="landing-hero">
  <h1>用自然语言，驱动数据分析</h1>
  <p>多智能体协同 · SQL 查询 · 趋势/产品/风险分析 · 可视化 · 多格式报告</p>
</section>

<!-- 登录/注册弹窗 -->
<div id="auth-modal" class="modal-overlay hidden">
  <div class="auth-card">
    <h2 id="auth-title">🤖 登录</h2>
    <p class="sub" id="auth-sub">登录以使用数据分析服务</p>
    <div class="auth-error" id="auth-error"></div>
    <form id="auth-form">
      <input type="hidden" id="auth-mode" data-mode="login">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="auth-account" placeholder="请输入账号" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="auth-password" placeholder="请输入密码" required>
      </div>
      <div class="form-group" id="auth-password2-group" style="display:none">
        <label>确认密码</label>
        <input type="password" id="auth-password2" placeholder="请再次输入密码">
      </div>
      <div class="form-group form-group-check">
        <input type="checkbox" id="auth-remember">
        <label for="auth-remember" style="margin:0">记住我（30天内免登录）</label>
      </div>
      <button type="submit" class="btn btn-primary" id="auth-submit">登 录</button>
    </form>
    <a class="auth-toggle" id="auth-toggle">没有账号？点击注册</a>
  </div>
</div>

</body>
</html>
