external_data_path: data/external/records.csv

# 分析流水线阶段级超时（pipeline-fault-tolerance spec）：单阶段超过此秒数按失败
# 处理（写降级占位、跳过依赖者、继续后续步骤）。线程池放弃语义——沿用 #4 SSE
# 取消的"不抢占 LLM"约束：超时仅放弃线程（残留完成、结果丢弃），不中断进行中
# 的 LLM 调用。<=0 禁用（直接同步执行，仅受客户端断连取消约束）。
# 与 model/factory.py LLM_REQUEST_TIMEOUT_S=180 对齐：阶段须容纳一次满额 LLM
# 调用 + 收尾（图表渲染等），取 200 留余量——否则"慢但会成功"的调用必被误杀
# （2026-09-03 实测 visualization 单次调用 152s 成功，却在 120s 阶段线上被放弃）。
stage_timeout_seconds: 200

# Goal 独立判断器（#2）：plan 执行完毕 ≠ 用户目标达成。run() 末尾对
# 「原始 query + 结果摘要」做一次独立 LLM 评估，产出 goal_check（goal_met/gap/
# suggested_followup）。enabled=false 省 1 次 LLM 调用；评估器失败 fail-open
# （不吞分析结果）。自动重规划未实现（YAGNI，见规格第 7 节）。
goal_evaluator:
  enabled: true

# DuckDB 查询通道资源上限（只读沙箱的 DoS 防护补全；对每用户 :memory: 连接生效。
# memory_limit/threads 经连接配置应用——SET/PRAGMA 被沙箱双拒不能走 SQL）
duckdb:
  memory_limit: "1GB"        # 单连接内存上限，超限落盘临时文件而非 OOM
  threads: 2                 # 单连接线程数上限
  max_result_rows: 10000     # 结果行数上限，超限报错提示加 LIMIT（喂 SQLAgent._fix_sql 自愈重试）
  query_timeout_seconds: 30  # 查询超时（watchdog interrupt），<=0 不启用
  instance_pool_cap: 50      # 每用户实例池 LRU 上限：超限驱逐最久未访问用户的实例（关闭连接），
                             # 被驱逐用户下次访问经数据集重灌透明重建（高用户 churn 下防内存只增不减）
