# 注意：实际使用的模型名称以 .env 中的环境变量为准（CHAT_MODEL_NAME / EMBEDDING_MODEL_NAME）。
# 下面两行仅作为环境变量缺失时的 fallback，由 model/factory.py 读取。
chat_model_name: qwen3-max
embedding_model_name: text-embedding-v4

# DashScope rerank 模型（复用 .env 的 DASHSCOPE_API_KEY）
# 注意：gte-rerank 对部分 Key 返回 403 AccessDenied，gte-rerank-v2 普遍可用。
rerank_model: gte-rerank-v2
# 粗召回数量（向量检索返回的候选数，rerank 前的候选池）
retrieve_k: 15
# rerank 后保留的最终文档数
rerank_top_n: 3
# rerank 分数阈值，低于此分数的文档丢弃
rerank_score_threshold: 0.3

# Hybrid 双路检索（方案一）：BM25 词法通道与向量粗召回 RRF 融合后统一精排。
# false 时代码跳过 BM25 构建与融合，检索行为与纯稠密现状逐字节等价。
hybrid_enabled: true
rrf_k: 60          # RRF 平滑常数（TREC 标准值）
bm25_top_k: 15     # BM25 路聚合后的截断数（与 retrieve_k 对称）
