<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">InsightForge AI — 多智能体协作数据分析平台</title>
  <desc id="hero-desc">用自然语言提问，AI 智能体自动编排 SQL 查询、多维分析、交互式图表与多格式报告导出</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#101624"/>
    </linearGradient>

    <!-- Forge accent gradient -->
    <linearGradient id="forgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0883E"/>
      <stop offset="100%" stop-color="#E0682A"/>
    </linearGradient>

    <!-- Blue accent gradient -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9EFF"/>
      <stop offset="100%" stop-color="#3D7EE8"/>
    </linearGradient>

    <!-- Pipeline line gradient -->
    <linearGradient id="pipeGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B9EFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0883E" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="pipeGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0883E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B9EFF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#5B9EFF" fill-opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="360" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="360" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="360" stroke="#5B9EFF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#5B9EFF" stroke-width="0.5"/>
  </g>

  <!-- ===== LEFT: Title Block ===== -->
  <g id="title-block" transform="translate(64, 72)">

    <!-- Category label -->
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="4" fill="#7888A0" font-weight="500">
      MULTI-AGENT DATA ANALYSIS
    </text>

    <!-- Project name -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="58" font-weight="800" fill="#EDF0F5" letter-spacing="-1">
      Insight<tspan fill="url(#forgeGrad)">Forge</tspan>
      <tspan font-size="58" font-weight="300" fill="#EDF0F5" letter-spacing="0"> AI</tspan>
    </text>

    <!-- Chinese subtitle -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="22" font-weight="500" fill="#7888A0" letter-spacing="2">
      多智能体协作数据分析平台
    </text>

    <!-- Tagline -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="17" font-weight="400" fill="#9AA8B8">
      用自然语言提问，自动编排 SQL 查询、多维分析、交互式图表与多格式报告导出
    </text>

    <!-- Tech badges row -->
    <g transform="translate(0, 168)">
      <!-- Python -->
      <rect x="0" y="0" width="72" height="24" rx="6" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <text x="36" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#5B9EFF" text-anchor="middle">Python</text>

      <!-- LangChain -->
      <rect x="80" y="0" width="82" height="24" rx="6" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <text x="121" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#5B9EFF" text-anchor="middle">LangChain</text>

      <!-- DuckDB -->
      <rect x="170" y="0" width="70" height="24" rx="6" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <text x="205" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#5B9EFF" text-anchor="middle">DuckDB</text>

      <!-- Plotly -->
      <rect x="248" y="0" width="62" height="24" rx="6" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <text x="279" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#5B9EFF" text-anchor="middle">Plotly</text>

      <!-- FastAPI -->
      <rect x="318" y="0" width="70" height="24" rx="6" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <text x="353" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#5B9EFF" text-anchor="middle">FastAPI</text>
    </g>
  </g>

  <!-- ===== RIGHT: Agent Pipeline Visualization ===== -->
  <g id="pipeline" transform="translate(760, 58)">

    <!-- Pipeline background card -->
    <rect x="0" y="0" width="384" height="244" rx="16" fill="#0D1320" stroke="#1E2A3A" stroke-width="1" opacity="0.8"/>

    <!-- Node 1: User Input -->
    <g transform="translate(24, 36)">
      <rect x="0" y="0" width="150" height="68" rx="10" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <!-- Icon circle -->
      <circle cx="28" cy="34" r="16" fill="#0D1320" stroke="#5B9EFF" stroke-width="1.5"/>
      <text x="28" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="15" fill="#5B9EFF" text-anchor="middle">?</text>
      <!-- Label -->
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="14" font-weight="600" fill="#EDF0F5">自然语言提问</text>
      <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" fill="#7888A0">"分析各月销售趋势"</text>
    </g>

    <!-- Node 2: SQL Agent -->
    <g transform="translate(210, 36)">
      <rect x="0" y="0" width="150" height="68" rx="10" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <circle cx="28" cy="34" r="16" fill="#0D1320" stroke="#F0883E" stroke-width="1.5"/>
      <text x="28" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="14" fill="#F0883E" text-anchor="middle">▸</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="14" font-weight="600" fill="#EDF0F5">SQL 智能查询</text>
      <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" fill="#7888A0">DuckDB 多表关联</text>
    </g>

    <!-- Node 3: Analysis -->
    <g transform="translate(24, 128)">
      <rect x="0" y="0" width="150" height="68" rx="10" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <circle cx="28" cy="34" r="16" fill="#0D1320" stroke="#F0883E" stroke-width="1.5"/>
      <text x="28" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="14" fill="#F0883E" text-anchor="middle">◈</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="14" font-weight="600" fill="#EDF0F5">多维智能分析</text>
      <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" fill="#7888A0">趋势 · 分组 · 异常检测</text>
    </g>

    <!-- Node 4: Report -->
    <g transform="translate(210, 128)">
      <rect x="0" y="0" width="150" height="68" rx="10" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
      <circle cx="28" cy="34" r="16" fill="#0D1320" stroke="#5B9EFF" stroke-width="1.5"/>
      <text x="28" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="14" fill="#5B9EFF" text-anchor="middle">☰</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="14" font-weight="600" fill="#EDF0F5">可视化 + 报告</text>
      <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" fill="#7888A0">Plotly 图表 · 多格式导出</text>
    </g>

    <!-- Connection: Node1 → Node2 (horizontal) -->
    <line x1="174" y1="70" x2="206" y2="70" stroke="#5B9EFF" stroke-width="1.2" stroke-opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Connection: Node2 → Node4 (down-right, diagonal) -->
    <path d="M285,104 L285,116 L260,116 L260,128" stroke="#F0883E" stroke-width="1.2" stroke-opacity="0.4" fill="none" marker-end="url(#arrow)"/>

    <!-- Connection: Node1 → Node3 (down) -->
    <line x1="99" y1="104" x2="99" y2="124" stroke="#5B9EFF" stroke-width="1.2" stroke-opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Connection: Node3 → Node4 (horizontal) -->
    <line x1="174" y1="162" x2="206" y2="162" stroke="#F0883E" stroke-width="1.2" stroke-opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Data particle 1 -->
    <circle cx="186" cy="70" r="2.5" fill="#5B9EFF" opacity="0.7">
      <animate attributeName="cx" values="176;194" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Data particle 2 -->
    <circle cx="99" cy="114" r="2.5" fill="#5B9EFF" opacity="0.5">
      <animate attributeName="cy" values="108;120" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Data particle 3 -->
    <circle cx="186" cy="162" r="2.5" fill="#F0883E" opacity="0.6">
      <animate attributeName="cx" values="176;194" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>