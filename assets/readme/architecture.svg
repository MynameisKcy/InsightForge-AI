<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">InsightForge AI 系统架构</title>
  <desc id="arch-desc">四层架构：前端层 (FastAPI 静态文件) → API 层 (SSE 流式响应, 鉴权, 配置热重载) → Agent 层 (Smart Assistant 模式 + Data Analysis 流水线) → 数据层 (DuckDB, SQLite, ChromaDB, 外部数据库)</desc>

  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#101624"/>
    </linearGradient>
    <linearGradient id="aAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0883E"/>
      <stop offset="100%" stop-color="#E0682A"/>
    </linearGradient>
    <linearGradient id="aBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9EFF"/>
      <stop offset="100%" stop-color="#3D7EE8"/>
    </linearGradient>
    <linearGradient id="aGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="aPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="aPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <marker id="aArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#5B9EFF" fill-opacity="0.4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" rx="20" fill="url(#aBg)"/>

  <!-- Section label -->
  <text x="600" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="16" font-weight="600" fill="#7888A0" text-anchor="middle" letter-spacing="3">
    SYSTEM ARCHITECTURE
  </text>

  <!-- ===== LAYER 1: Frontend ===== -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="1128" height="60" rx="12" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
    <text x="36" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="14" font-weight="700" fill="#EDF0F5">前端层</text>
    <text x="100" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="12" fill="#7888A0">FastAPI 静态文件服务 · 落地页 (双主题) · 工作台 (对话/分析) · 无前端构建</text>

    <!-- Browser icon -->
    <rect x="760" y="12" width="120" height="36" rx="8" fill="#0D1320" stroke="#5B9EFF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="820" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="11" fill="#5B9EFF" text-anchor="middle">浏览器</text>
    <rect x="892" y="12" width="120" height="36" rx="8" fill="#0D1320" stroke="#F0883E" stroke-width="1" stroke-opacity="0.4"/>
    <text x="952" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="11" fill="#F0883E" text-anchor="middle">落地页</text>
    <rect x="1024" y="12" width="80" height="36" rx="8" fill="#0D1320" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1064" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="11" fill="#34D399" text-anchor="middle">工作台</text>
  </g>

  <!-- Arrow Layer 1→2 -->
  <line x1="600" y1="120" x2="600" y2="140" stroke="#5B9EFF" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#aArrow)"/>

  <!-- ===== LAYER 2: API ===== -->
  <g transform="translate(36, 148)">
    <rect x="0" y="0" width="1128" height="60" rx="12" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
    <text x="36" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="14" font-weight="700" fill="#EDF0F5">API 层</text>
    <text x="100" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="12" fill="#7888A0">FastAPI + uvicorn · SSE 流式响应 · JWT 鉴权 · 配置热重载 · 数据集管理 · 报告导出</text>

    <!-- Feature pills -->
    <g transform="translate(700, 14)">
      <rect x="0" y="0" width="56" height="32" rx="6" fill="#0D1320" stroke="#5B9EFF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="28" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#5B9EFF" text-anchor="middle">SSE</text>
      <rect x="64" y="0" width="56" height="32" rx="6" fill="#0D1320" stroke="#34D399" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="92" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#34D399" text-anchor="middle">JWT</text>
      <rect x="128" y="0" width="56" height="32" rx="6" fill="#0D1320" stroke="#F0883E" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="156" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#F0883E" text-anchor="middle">热重载</text>
      <rect x="192" y="0" width="56" height="32" rx="6" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="220" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#A78BFA" text-anchor="middle">鉴权</text>
      <rect x="256" y="0" width="72" height="32" rx="6" fill="#0D1320" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="292" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#22D3EE" text-anchor="middle">数据集API</text>
      <rect x="336" y="0" width="72" height="32" rx="6" fill="#0D1320" stroke="#F472B6" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="372" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#F472B6" text-anchor="middle">导出API</text>
    </g>
  </g>

  <!-- Arrow Layer 2→3 -->
  <line x1="600" y1="208" x2="600" y2="228" stroke="#5B9EFF" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#aArrow)"/>

  <!-- ===== LAYER 3: Agent Layer ===== -->
  <g transform="translate(36, 236)">
    <rect x="0" y="0" width="1128" height="150" rx="12" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
    <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="14" font-weight="700" fill="#EDF0F5">Agent 层</text>

    <!-- Divider -->
    <line x1="540" y1="12" x2="540" y2="138" stroke="#1E2A3A" stroke-width="0.5"/>

    <!-- Left: Smart Assistant Mode -->
    <text x="290" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="12" font-weight="600" fill="#A78BFA" text-anchor="middle">Smart Assistant 模式</text>

    <g transform="translate(60, 68)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="50" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" fill="#A78BFA" text-anchor="middle">ReactAgent</text>
      <rect x="120" y="0" width="100" height="36" rx="8" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="170" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#A78BFA" text-anchor="middle">15 @tool</text>
      <rect x="240" y="0" width="100" height="36" rx="8" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="290" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#A78BFA" text-anchor="middle">3 middleware</text>
      <rect x="360" y="0" width="100" height="36" rx="8" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="410" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#A78BFA" text-anchor="middle">流式响应</text>
    </g>

    <text x="290" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="10" fill="#7888A0" text-anchor="middle">对话式 · RAG 问答 · 触发全链路分析</text>

    <!-- Right: Data Analysis Pipeline -->
    <text x="824" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="12" font-weight="600" fill="#F0883E" text-anchor="middle">Data Analysis 流水线</text>

    <g transform="translate(592, 68)">
      <rect x="0" y="0" width="90" height="36" rx="8" fill="#0D1320" stroke="#F0883E" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="45" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#F0883E" text-anchor="middle">PlannerAgent</text>
      <rect x="104" y="0" width="72" height="36" rx="8" fill="#0D1320" stroke="#5B9EFF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="140" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#5B9EFF" text-anchor="middle">SQLAgent</text>
      <rect x="190" y="0" width="90" height="36" rx="8" fill="#0D1320" stroke="#F0883E" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="235" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#F0883E" text-anchor="middle">Analysis</text>
      <rect x="294" y="0" width="80" height="36" rx="8" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="334" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#A78BFA" text-anchor="middle">Visualization</text>
      <rect x="388" y="0" width="72" height="36" rx="8" fill="#0D1320" stroke="#34D399" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="424" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#34D399" text-anchor="middle">Report</text>
      <rect x="474" y="0" width="64" height="36" rx="8" fill="#0D1320" stroke="#5B9EFF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="506" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="10" fill="#5B9EFF" text-anchor="middle">Export</text>
    </g>

    <text x="824" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="10" fill="#7888A0" text-anchor="middle">LLM 生成执行计划 → 顺序调度 → PipelineContext 传递结果</text>
  </g>

  <!-- Arrow Layer 3→4 -->
  <line x1="600" y1="386" x2="600" y2="406" stroke="#5B9EFF" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#aArrow)"/>

  <!-- ===== LAYER 4: Data Layer ===== -->
  <g transform="translate(36, 414)">
    <rect x="0" y="0" width="1128" height="100" rx="12" fill="#141B2B" stroke="#1E2A3A" stroke-width="1"/>
    <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="14" font-weight="700" fill="#EDF0F5">数据层</text>

    <g transform="translate(36, 44)">
      <!-- DuckDB -->
      <rect x="0" y="0" width="190" height="40" rx="8" fill="#0D1320" stroke="#F0883E" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="95" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" font-weight="600" fill="#F0883E" text-anchor="middle">DuckDB :memory:</text>
      <text x="95" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#7888A0" text-anchor="middle">按用户隔离 · OLAP 引擎</text>

      <!-- SQLite -->
      <rect x="206" y="0" width="160" height="40" rx="8" fill="#0D1320" stroke="#5B9EFF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="286" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" font-weight="600" fill="#5B9EFF" text-anchor="middle">SQLite ×5</text>
      <text x="286" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#7888A0" text-anchor="middle">用户·记忆·图表·数据源</text>

      <!-- ChromaDB -->
      <rect x="382" y="0" width="160" height="40" rx="8" fill="#0D1320" stroke="#A78BFA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="462" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" font-weight="600" fill="#A78BFA" text-anchor="middle">ChromaDB</text>
      <text x="462" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#7888A0" text-anchor="middle">RAG 向量库 · 记忆召回</text>

      <!-- External DBs -->
      <rect x="558" y="0" width="160" height="40" rx="8" fill="#0D1320" stroke="#34D399" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="638" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">MySQL / PostgreSQL</text>
      <text x="638" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#7888A0" text-anchor="middle">postgres_scan · mysql_scan</text>

      <!-- File Storage -->
      <rect x="734" y="0" width="160" height="40" rx="8" fill="#0D1320" stroke="#F472B6" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="814" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" font-weight="600" fill="#F472B6" text-anchor="middle">文件存储</text>
      <text x="814" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#7888A0" text-anchor="middle">CSV/Excel · 报告 · 图表</text>

      <!-- DashScope API -->
      <rect x="910" y="0" width="182" height="40" rx="8" fill="#0D1320" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="1001" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
            font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">DashScope API</text>
      <text x="1001" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="9" fill="#7888A0" text-anchor="middle">LLM · Embeddings · Rerank</text>
    </g>
  </g>

  <!-- Cross-cutting concerns -->
  <g transform="translate(36, 526)">
    <rect x="0" y="0" width="1128" height="26" rx="8" fill="#0D1320" stroke="#1E2A3A" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="564" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="10" fill="#7888A0" text-anchor="middle">
      contextvars 用户隔离 · Fernet 加密 · 多编码 CSV 回退 · jieba 中文分词 · 脏数据自适应清洗 · 无缓存中间件
    </text>
  </g>
</svg>