# InsightForge AI CI：push(dev/main) + PR(main) 触发；ruff lint + 全量离线 pytest。
# 本地沙箱 safe-delete 导致的 2 个 flaky 失败在 GHA Ubuntu 不复现（os.remove 行为确定）。
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (offline, LLM 100% mocked)
        run: python -m pytest tests/ -q

      - name: Frontend unit tests (node:test, P1-1)
        run: node --test tests/js/stream_dedup.test.js
